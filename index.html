<style>
  :root { --bg:#EEF0F4; --card:#fff; --ink:#111827; --muted:#6B7280; --line:#E5E7EB; --acc:#C99F60; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; padding:40px 16px; }
  main { max-width:640px; margin:0 auto; }
  h1 { font-size:22px; display:flex; align-items:center; gap:10px; }
  h1 i { width:14px; height:14px; background:var(--acc); display:inline-block; }
  p { color:var(--muted); margin-top:6px; }
  ul { list-style:none; margin-top:24px; display:grid; gap:12px; }
  a { display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; color:inherit; text-decoration:none; font-weight:600; }
  a:hover { border-color:var(--acc); }
  a small { color:var(--muted); font-weight:500; }
</style>
</head>

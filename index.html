<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LifeCell · Design pages</title>
<style>
  :root { --bg:#F7F3EC; --card:#fff; --ink:#111827; --muted:#6B7280; --line:#EAE2D4; --acc:#C99F60; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { background:var(--bg); }
  body { min-height:100vh; color:var(--ink); font:15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; padding:40px 16px;
    background:
      radial-gradient(60% 40% at 50% 0, rgba(217,183,124,.22) 0, rgba(217,183,124,0) 70%),
      radial-gradient(40% 30% at 100% 100%, rgba(217,183,124,.12) 0, rgba(217,183,124,0) 70%),
      linear-gradient(180deg, #FBF8F3 0%, #F4EEE4 100%); }
  a { box-shadow: 0 6px 20px rgba(120,90,40,.06); }
  main { max-width:640px; margin:0 auto; }
  h1 { font-size:22px; display:flex; align-items:center; gap:10px; }
  h1 img { height:26px; width:auto; display:block; }
  h1 span { color:var(--muted); font-weight:500; }
  p { color:var(--muted); margin-top:6px; }
  ul { list-style:none; margin-top:24px; display:grid; gap:12px; }
  a { display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; color:inherit; text-decoration:none; font-weight:600; }
  a:hover { border-color:var(--acc); }
  a small { color:var(--muted); font-weight:500; }
  a .name { display:flex; align-items:center; gap:14px; }
  .ico { width:40px; height:40px; border-radius:10px; flex:none; display:grid; place-items:center; overflow:hidden; }
  .ico img { width:100%; height:100%; object-fit:cover; }
  .ico.hh { background:#0B2A21; box-shadow: inset 0 0 0 1.5px #C9A46A; color:#E6C88F; font:italic 700 15px/1 Georgia, serif; }
  .ico.bf { background:#0E0D0C; box-shadow: inset 0 0 0 1.5px #C9A46A; color:#E6C88F; font:italic 700 15px/1 Georgia, serif; }
</style>
</head>
<body>
<main>
  <h1><img src="exosome/assets/logo-dark.png" alt="LifeCell" width="1227" height="299"><span>· design pages</span></h1>
  <p>Design previews: pre-sale pages and banners.</p>
  <ul>
    <li><a href="hands/"><span class="name"><span class="ico"><img src="hands/assets/tube-icon.jpg" alt=""></span>Overnight Hand Treatment</span> <small>B · Wine Studio (men) →</small></a></li>
    <li><a href="happy-holiday-banner/"><span class="name"><span class="ico hh">HH</span>Happy Holiday banner</span> <small>Green · Red · Gold →</small></a></li>
    <li><a href="bf-banner/"><span class="name"><span class="ico bf">BF</span>Black Friday banners</span> <small>Gold Luxe · Gold Foil →</small></a></li>
    <li><a href="exosome/"><span class="name"><span class="ico"><img src="exosome/assets/bottle-thumb.jpg" alt=""></span>Exosomes Collagen Builder</span> <small>A · Black Gold · B · Ivory Gold · C · Bordeaux Gold →</small></a></li>
  </ul>
</main>
</body>
</html>
